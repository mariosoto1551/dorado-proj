# Construye las 9 imágenes backend en GitHub Actions (red rápida) y las publica
# en GHCR (ghcr.io). Así el VPS no necesita buildear (alcanza uno de 2 GB): solo
# descarga y corre. Ver docs/runbook-deploy-vps.md (variante "imágenes pre-armadas").
name: build-images

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'libs/**'
      - 'infra/docker/Dockerfile.service'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/images.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - gateway
          - identity-service
          - billing-service
          - activity-service
          - session-service
          - scoring-service
          - rewards-service
          - notification-service
          - audit-service
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.service
          build-args: SERVICE=${{ matrix.service }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/dorado-${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
