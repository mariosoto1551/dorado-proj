<div class="flex min-h-dvh flex-col">
  <header class="flex h-14 items-center justify-between border-b border-slate-200 bg-white px-4">
    <span class="text-lg font-bold tracking-tight">Dorado</span>

    <div class="flex items-center gap-3">
      <span class="max-w-40 truncate text-sm text-slate-700 sm:max-w-none">
        {{ auth.nombreMostrable() }}
      </span>
      <button
        type="button"
        (click)="salir()"
        class="rounded-lg border border-slate-300 px-3 py-1.5 text-sm font-medium text-slate-700 transition hover:bg-slate-50"
      >
        Salir
      </button>
    </div>
  </header>

  <div class="flex flex-1">
    <!-- Sidebar placeholder: la navegación real llega en Fase 10. -->
    <aside class="hidden w-56 border-r border-slate-200 bg-white p-4 md:block">
      <p class="text-xs uppercase tracking-wide text-slate-400">Navegación</p>
    </aside>

    <main class="flex-1">
      <router-outlet />
    </main>
  </div>
</div>
