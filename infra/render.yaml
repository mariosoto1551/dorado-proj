# Blueprint de Render — los 9 procesos backend + 1 Postgres gestionado.
# (Los 2 frontends van a Vercel; ver apps/*/vercel.json y docs/runbook-deploy.md.)
#
# Cómo se usa: New → Blueprint → apuntar a este archivo. Render construye cada
# servicio con infra/docker/Dockerfile.service, pasando la env var `SERVICE`
# como build-arg (comportamiento documentado de Render: las env vars están
# disponibles como build arguments), así el mismo Dockerfile sirve para los 9.
#
# Valores `sync: false` = se cargan a mano en el panel (secretos o derivados que
# el Blueprint no puede templatear). El runbook dice exactamente qué poner.
#
# ── Postgres: UNA instancia, 8 bases (como en local) ──
# Render Postgres crea 1 base; las otras 7 se crean UNA vez con el script
# infra/docker/init-databases.sh vía psql (paso del runbook). Cada servicio
# apunta su DATABASE_URL a la Internal Database URL cambiando el nombre de base.

databases:
  - name: dorado-postgres
    databaseName: identity_db
    postgresMajorVersion: '18'
    plan: basic-256mb # el free se pausa; el scheduler de session-service no puede dormir

services:
  # ─────────────── identity-service (emisor de JWT) ───────────────
  - type: web
    name: identity-service
    runtime: docker
    dockerfilePath: ./infra/docker/Dockerfile.service
    dockerContext: .
    plan: starter
    region: oregon
    healthCheckPath: /internal/health
    autoDeploy: true
    envVars:
      - key: SERVICE
        value: identity-service
      - key: PORT
        value: '3001'
      - key: DATABASE_URL # Internal Database URL de dorado-postgres, base identity_db
        sync: false
      - key: GATEWAY_INTERNAL_SECRET
        generateValue: true # se genera una vez; copiar el MISMO valor al resto
      - key: JWT_PUBLIC_KEY
        sync: false
      - key: JWT_PRIVATE_KEY # SOLO identity
        sync: false
      - key: RABBITMQ_URL # AMQPS de CloudAMQP
        sync: false
      - key: BILLING_INTERNAL_URL
        sync: false # URL interna: http://<servicio>:<puerto> (ver runbook)
      - key: REFRESH_COOKIE_SECURE
        value: 'true'
      - key: LOG_LEVEL
        value: info

  # ─────────────── billing-service ───────────────
